<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>藝數探索｜打洞模擬器・進階版</title>
<style>
:root{--blue:#2f75b5;--ink:#203040;--paper:#fffdf5;--grid:#cfdae2;--red:#e45454;--purple:#7654a8}
*{box-sizing:border-box} body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;background:#f4f8fb;color:var(--ink)}
header{background:linear-gradient(135deg,#214f7b,#3887c7);color:#fff;padding:13px 18px;box-shadow:0 2px 8px #0002}
.head{max-width:1240px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:clamp(21px,2.6vw,30px);margin:0}.topright{display:flex;align-items:center;gap:9px}.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #fff}
.pill,.navlink{border:1px solid #ffffff66;background:#ffffff18;color:#fff;border-radius:999px;padding:7px 11px;font-size:13px;text-decoration:none}
.wrap{max-width:1240px;margin:16px auto;padding:0 14px;display:grid;grid-template-columns:390px 1fr;gap:15px}
.card{background:#fff;border:1px solid #d9e6ef;border-radius:15px;padding:14px;box-shadow:0 4px 15px #244b6a10}
h2{font-size:19px;margin:0 0 8px}.small{font-size:13.5px;color:#60717d;line-height:1.6}.sub{font-weight:800;color:#315d80;margin:13px 0 7px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px}button,select,input{font:inherit}
button{border:1px solid #9ec3df;background:#eff8ff;color:#174e78;border-radius:10px;padding:9px 8px;cursor:pointer;min-height:42px}
button:hover:not(:disabled){background:#dfeffc}button:disabled{opacity:.38;cursor:not-allowed}
.diag{background:#fff7e8;border-color:#e6bd78;color:#765013}.special{background:#f5efff;border-color:#bda8e0;color:#5b408a}.danger{background:#fff0f0;border-color:#e6a3a3;color:#8c3838}.ok{background:#eaf8ef;border-color:#92cda9;color:#256c43}
.section{border-top:1px dashed #cedae2;margin-top:12px;padding-top:10px}.locked{font-size:12.5px;background:#f2f4f6;border-radius:9px;padding:8px;color:#71808a}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.stat{background:#f5f8fa;border:1px solid #e2ebf1;border-radius:10px;padding:7px;text-align:center}.stat b{display:block;font-size:19px;color:#245f97}
.history{background:#f7f7f7;border-radius:9px;padding:8px;min-height:42px;font-size:12.5px;line-height:1.5;max-height:90px;overflow:auto}
.stage{display:flex;flex-direction:column;align-items:center}.stageHead{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px}.badge{font-size:12.5px;background:#edf6fd;color:#32698f;border-radius:999px;padding:6px 9px}
#svg{width:min(100%,650px);height:auto;touch-action:none;user-select:none}.grid{stroke:#bfd0dc;stroke-width:1.15;opacity:.95}.layer{stroke:#6f8797;stroke-width:1.2}.outline{fill:none;stroke:#597488;stroke-width:2.5}.crease{stroke:var(--red);stroke-width:2.5;stroke-dasharray:8 6}.oldcrease{stroke:#ef8d8d;stroke-width:1.5;stroke-dasharray:6 6;opacity:.7}.custom{stroke:var(--purple);stroke-width:3;stroke-dasharray:7 5}.hole{fill:#222;stroke:#fff;stroke-width:2}.punch{fill:#f19c38;stroke:#fff;stroke-width:2}
.actions{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:7px}.tip{background:#fff8df;border-left:4px solid #f3b16e;border-radius:8px;padding:9px;margin-top:10px}
.expertBox{background:#faf7ff;border:1px solid #dfd2f4;border-radius:10px;padding:9px}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
input[type=range]{width:150px}.target{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.target select{padding:7px;border-radius:8px;border:1px solid #cbd9e2}
footer{text-align:center;color:#74828c;font-size:13px;padding:0 10px 17px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div class="head">
  <div><h1>線對稱打洞模擬器・進階版</h1></div>
  <div class="topright"><a class="navlink" href="index.html">← 回初級版</a><div class="pill" style="display:flex;align-items:center;gap:7px"><img class="avatar" src="author-avatar.svg"><span>徐丙忠老師</span></div></div>
</div></header>

<main class="wrap">
<section class="card">
  <h2>① 選擇摺法</h2>
  <div class="small">這一版每一次都是針對<strong>目前可見的紙張</strong>計算摺線，不再固定於原正方形中央。</div>

  <div class="sub">基本對半摺</div>
  <div class="controls">
    <button onclick="basicFold('L2R')">→ 左半摺到右半</button>
    <button onclick="basicFold('R2L')">← 右半摺到左半</button>
    <button onclick="basicFold('T2B')">↓ 上半摺到下半</button>
    <button onclick="basicFold('B2T')">↑ 下半摺到上半</button>
  </div>

  <div id="diagSection" class="section">
    <div class="sub" style="margin-top:0">斜線對摺 <span class="small">（目前紙張接近正方形時出現）</span></div>
    <div id="diagButtons" class="controls">
      <button class="diag" onclick="diagFold('UR2LL')">↙ 右上摺到左下</button>
      <button class="diag" onclick="diagFold('LL2UR')">↗ 左下摺到右上</button>
      <button class="diag" onclick="diagFold('UL2LR')">↘ 左上摺到右下</button>
      <button class="diag" onclick="diagFold('LR2UL')">↖ 右下摺到左上</button>
    </div>
    <div id="diagLocked" class="locked" style="display:none">目前紙張不是接近正方形，斜線對摺暫時隱藏。</div>
  </div>

  <div class="section">
    <div class="sub" style="margin-top:0">局部摺 <span class="small">（完成 1 次摺紙後解鎖）</span></div>
    <div id="quarterButtons" class="controls">
      <button class="special" onclick="stripFold('L',.25)">→ 左側 1/4 向內摺</button>
      <button class="special" onclick="stripFold('R',.25)">← 右側 1/4 向內摺</button>
      <button class="special" onclick="stripFold('T',.25)">↓ 上側 1/4 向內摺</button>
      <button class="special" onclick="stripFold('B',.25)">↑ 下側 1/4 向內摺</button>
    </div>
    <div id="quarterLocked" class="locked">先完成一次基本摺紙，局部摺選項才會出現。</div>
  </div>


  <div class="actions">
    <button onclick="undo()">↶ 回到上一步</button>
    <button class="danger" onclick="resetAll()">重新開始</button>
  </div>

  <div class="stats">
    <div class="stat"><span>已摺</span><b id="foldCount">0</b><span>次</span></div>
    <div class="stat"><span>紙層片段</span><b id="layerCount">1</b><span>片</span></div>
    <div class="stat"><span>展開洞數</span><b id="holeCount">0</b><span>個</span></div>
  </div>
  <div class="sub">摺紙紀錄</div>
  <div id="history" class="history">尚未摺紙</div>
</section>

<section class="card stage">
  <div class="stageHead"><h2>② 摺紙與打洞區</h2><span class="badge" id="status">請選摺法，或直接打洞</span></div>
  <div class="target" style="width:100%;margin-bottom:5px"><span class="small">學習單關卡：</span>
    <select id="challenge" onchange="drawTarget()">
      <option value="0">不顯示目標</option><option value="1">第1關・2洞</option><option value="2">第2關・4洞</option>
      <option value="3">第3關・4洞</option><option value="4">第4關・4洞</option><option value="5">第5關・8洞</option>
      <option value="6">第6關・8洞</option><option value="7">第7關・16洞</option><option value="8">第8關・16洞</option>
      <option value="9">第9關・3洞</option><option value="10">第10關・6洞</option><option value="11">第11關・5洞</option><option value="12">第12關・12洞</option>
    </select><span class="small">淡藍點僅作為目標參考，不影響打洞。</span>
  </div>
  <svg id="svg" viewBox="0 0 520 520">
    <rect x="60" y="60" width="400" height="400" fill="#f9fbfc" stroke="#d7e2e9" stroke-width="1"/>
    <g id="grid"></g><g id="targetG"></g><g id="layersG"></g><g id="creasesG"></g><g id="animG"></g><g id="holesG"></g>
    <rect x="60" y="60" width="400" height="400" class="outline" pointer-events="none"/>
  </svg>
  <div class="actions">
    <button class="ok" onclick="unfold()">展開檢查</button>
    <button onclick="clearPunch()">清除打洞點</button>
  </div>
  <div style="width:100%;border-top:1px dashed #cedae2;margin-top:10px;padding-top:9px">
    <b>③ 展開結果</b><div class="small" id="resultMsg">在目前可見的紙張上點一下，再按「展開檢查」。</div>
  </div>
</section>
</main>
<footer><b>藝數探索-打洞模擬器｜進階版</b></footer>

<script>
const ORG={x0:60,y0:60,x1:460,y1:460};
const ID=[1,0,0,0,1,0];
let layers=[{poly:[[60,60],[460,60],[460,460],[60,460]],M:ID.slice()}], creases=[], history=[], undoStack=[], punch=null, holes=[];
let animating=false;

const targets={
1:[[6,4],[4,6]],
2:[[2,1],[5,1],[2,6],[5,6]],
3:[[7,0],[5,2],[2,5],[0,7]],
4:[[0,0],[7,0],[2,2],[5,2]],
5:[[2,0],[5,0],[0,2],[7,2],[0,5],[7,5],[2,7],[5,7]],
6:[[5,4],[6,4],[4,5],[7,5],[4,6],[7,6],[5,7],[6,7]],
7:[[1,0],[2,0],[5,0],[6,0],[0,1],[7,1],[0,2],[7,2],[0,5],[7,5],[0,6],[7,6],[1,7],[2,7],[5,7],[6,7]],
8:[[3,0],[4,0],[3,1],[4,1],[0,3],[1,3],[0,4],[1,4],[6,3],[7,3],[6,4],[7,4],[3,6],[4,6],[3,7],[4,7]],
9:[[0,0],[2,2],[4,4]],
10:[[0,0],[2,2],[5,2],[2,5],[5,5],[0,7]],
11:[[0,0],[2,2],[5,2],[2,5],[5,5]],
12:[[1,0],[2,0],[0,1],[3,1],[0,2],[1,3],[6,7],[5,7],[7,6],[4,6],[7,5],[6,4]]
};

function deepState(){return {layers:layers.map(L=>({poly:L.poly.map(p=>p.slice()),M:L.M.slice()})),creases:creases.map(c=>({...c,A:c.A.slice(),B:c.B.slice()})),history:history.slice(),punch:punch&&punch.slice(),holes:holes.map(p=>p.slice())}}
function restore(s){layers=s.layers.map(L=>({poly:L.poly.map(p=>p.slice()),M:L.M.slice()}));creases=s.creases.map(c=>({...c,A:c.A.slice(),B:c.B.slice()}));history=s.history.slice();punch=s.punch&&s.punch.slice();holes=s.holes.map(p=>p.slice());render()}
function bbox(){let xs=[],ys=[];layers.forEach(L=>L.poly.forEach(p=>{xs.push(p[0]);ys.push(p[1])}));return {xmin:Math.min(...xs),xmax:Math.max(...xs),ymin:Math.min(...ys),ymax:Math.max(...ys)}}
function side(A,B,P){return (B[0]-A[0])*(P[1]-A[1])-(B[1]-A[1])*(P[0]-A[0])}
function intersect(A,B,P,Q){let s1=side(A,B,P),s2=side(A,B,Q),t=s1/(s1-s2);return [P[0]+t*(Q[0]-P[0]),P[1]+t*(Q[1]-P[1])]}
function clip(poly,A,B,keepSign){let out=[];for(let i=0;i<poly.length;i++){let P=poly[i],Q=poly[(i+1)%poly.length],p=side(A,B,P)*keepSign>=-1e-7,q=side(A,B,Q)*keepSign>=-1e-7;if(p&&q)out.push(Q);else if(p&&!q)out.push(intersect(A,B,P,Q));else if(!p&&q){out.push(intersect(A,B,P,Q));out.push(Q)}}return dedupe(out)}
function dedupe(poly){let o=[];poly.forEach(p=>{if(!o.length||Math.hypot(o.at(-1)[0]-p[0],o.at(-1)[1]-p[1])>.05)o.push(p)});if(o.length>2&&Math.hypot(o[0][0]-o.at(-1)[0],o[0][1]-o.at(-1)[1])<.05)o.pop();return o}
function area(poly){let a=0;for(let i=0;i<poly.length;i++){let p=poly[i],q=poly[(i+1)%poly.length];a+=p[0]*q[1]-q[0]*p[1]}return Math.abs(a)/2}
function reflect(P,A,B){let dx=B[0]-A[0],dy=B[1]-A[1],l2=dx*dx+dy*dy,t=((P[0]-A[0])*dx+(P[1]-A[1])*dy)/l2;let H=[A[0]+t*dx,A[1]+t*dy];return [2*H[0]-P[0],2*H[1]-P[1]]}
function reflMatrix(A,B){let o=reflect([0,0],A,B),ex=reflect([1,0],A,B),ey=reflect([0,1],A,B);return [ex[0]-o[0],ey[0]-o[0],o[0],ex[1]-o[1],ey[1]-o[1],o[1]]}
function compose(M,N){return [M[0]*N[0]+M[1]*N[3],M[0]*N[1]+M[1]*N[4],M[0]*N[2]+M[1]*N[5]+M[2],M[3]*N[0]+M[4]*N[3],M[3]*N[1]+M[4]*N[4],M[3]*N[2]+M[4]*N[5]+M[5]]}
function applyM(M,p){return [M[0]*p[0]+M[1]*p[1]+M[2],M[3]*p[0]+M[4]*p[1]+M[5]]}
function pointIn(p,poly){let x=p[0],y=p[1],ins=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){let xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi+1e-12)+xi))ins=!ins}return ins}
function unique(pts){let o=[];pts.forEach(p=>{if(p[0]<59||p[0]>461||p[1]<59||p[1]>461)return;if(!o.some(q=>Math.hypot(q[0]-p[0],q[1]-p[1])<1))o.push(p)});return o}

function animateFold(pieces,A,B,onDone){
 const g=document.getElementById('animG'); g.innerHTML=''; animating=true;
 document.getElementById('status').textContent='正在對摺…';
 const start=performance.now(),dur=700;
 function frame(now){
   const r=Math.min(1,(now-start)/dur), t=r<.5?2*r*r:1-Math.pow(-2*r+2,2)/2;
   g.innerHTML='';
   pieces.forEach(poly=>{
     const target=poly.map(p=>reflect(p,A,B));
     const pts=poly.map((p,i)=>[p[0]+(target[i][0]-p[0])*t,p[1]+(target[i][1]-p[1])*t]);
     g.insertAdjacentHTML('beforeend',`<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="#bfe0f8" stroke="#2f75b5" stroke-width="2" opacity=".72"/>`);
   });
   if(r<1) requestAnimationFrame(frame); else {g.innerHTML='';animating=false;onDone();}
 }
 requestAnimationFrame(frame);
}
function fold(A,B,moveSign,label){
 if(animating)return;
 const snapshot=deepState(), R=reflMatrix(A,B), next=[], movingPieces=[];
 layers.forEach(L=>{
   const keep=clip(L.poly,A,B,-moveSign), mov=clip(L.poly,A,B,moveSign);
   if(keep.length>=3&&area(keep)>.2)next.push({poly:keep,M:L.M.slice()});
   if(mov.length>=3&&area(mov)>.2){movingPieces.push(mov);next.push({poly:mov.map(p=>reflect(p,A,B)),M:compose(L.M,R)});}
 });
 if(!movingPieces.length){alert("這條摺線沒有可摺動的紙張。");return}
 animateFold(movingPieces,A,B,()=>{
   undoStack.push(snapshot); punch=null;holes=[]; layers=next;
   creases.push({A:A.slice(),B:B.slice(),label});history.push(label);render();
 });
}
function basicFold(t){let b=bbox(),xm=(b.xmin+b.xmax)/2,ym=(b.ymin+b.ymax)/2;if(t==='L2R')fold([xm,b.ymin-50],[xm,b.ymax+50],1,'→ 左半摺到右半');if(t==='R2L')fold([xm,b.ymin-50],[xm,b.ymax+50],-1,'← 右半摺到左半');if(t==='T2B')fold([b.xmin-50,ym],[b.xmax+50,ym],-1,'↓ 上半摺到下半');if(t==='B2T')fold([b.xmin-50,ym],[b.xmax+50,ym],1,'↑ 下半摺到上半')}
function diagFold(t){let b=bbox();if(t==='UR2LL')fold([b.xmin,b.ymin],[b.xmax,b.ymax],-1,'↙ 右上摺到左下');if(t==='LL2UR')fold([b.xmin,b.ymin],[b.xmax,b.ymax],1,'↗ 左下摺到右上');if(t==='UL2LR')fold([b.xmax,b.ymin],[b.xmin,b.ymax],1,'↘ 左上摺到右下');if(t==='LR2UL')fold([b.xmax,b.ymin],[b.xmin,b.ymax],-1,'↖ 右下摺到左上')}
function stripFold(s,f){let b=bbox();if(s==='L'){let x=b.xmin+(b.xmax-b.xmin)*f;fold([x,b.ymin-60],[x,b.ymax+60],1,'→ 左側 1/4 向內摺')}if(s==='R'){let x=b.xmax-(b.xmax-b.xmin)*f;fold([x,b.ymin-60],[x,b.ymax+60],-1,'← 右側 1/4 向內摺')}if(s==='T'){let y=b.ymin+(b.ymax-b.ymin)*f;fold([b.xmin-60,y],[b.xmax+60,y],-1,'↓ 上側 1/4 向內摺')}if(s==='B'){let y=b.ymax-(b.ymax-b.ymin)*f;fold([b.xmin-60,y],[b.xmax+60,y],1,'↑ 下側 1/4 向內摺')}}

function undo(){if(!undoStack.length)return;restore(undoStack.pop())}
function resetAll(){layers=[{poly:[[60,60],[460,60],[460,460],[60,460]],M:ID.slice()}];creases=[];history=[];undoStack=[];punch=null;holes=[];animating=false;document.getElementById('animG').innerHTML='';render()}
function clearPunch(){punch=null;holes=[];document.getElementById('resultMsg').textContent='已清除打洞點。';render()}
function unfold(){if(!punch){alert('請先在目前紙張上打洞。');return}let pts=[];layers.forEach(L=>{if(pointIn(punch,L.poly))pts.push(applyM(L.M,punch))});holes=unique(pts);document.getElementById('resultMsg').textContent='展開後共有 '+holes.length+' 個洞。可與左上選擇的學習單目標比較。';render()}

function drawGrid(){let g=document.getElementById('grid');g.innerHTML='';for(let i=1;i<8;i++){let v=60+i*50;g.insertAdjacentHTML('beforeend',`<line x1="${v}" y1="60" x2="${v}" y2="460" class="grid"/><line x1="60" y1="${v}" x2="460" y2="${v}" class="grid"/>`)}}
function drawTarget(){let g=document.getElementById('targetG');g.innerHTML='';let n=+document.getElementById('challenge').value;if(!n)return;(targets[n]||[]).forEach(([col,row])=>{let x=60+(col+.5)*50,y=60+(row+.5)*50;g.insertAdjacentHTML('beforeend',`<circle cx="${x}" cy="${y}" r="9" fill="#6fb3e3" opacity=".32"/>`)})}
function render(){
 let lg=document.getElementById('layersG');lg.innerHTML='';layers.forEach((L,i)=>lg.insertAdjacentHTML('beforeend',`<polygon points="${L.poly.map(p=>p.join(',')).join(' ')}" class="layer" fill="rgba(255,253,245,${Math.min(.28+.06*i,.78)})"/>`));
 let cg=document.getElementById('creasesG');cg.innerHTML='';creases.forEach((c,i)=>cg.insertAdjacentHTML('beforeend',`<line x1="${c.A[0]}" y1="${c.A[1]}" x2="${c.B[0]}" y2="${c.B[1]}" class="oldcrease"/>`));
 let hg=document.getElementById('holesG');hg.innerHTML='';if(holes.length)holes.forEach(p=>hg.insertAdjacentHTML('beforeend',`<circle cx="${p[0]}" cy="${p[1]}" r="8" class="hole"/>`));else if(punch)hg.insertAdjacentHTML('beforeend',`<circle cx="${punch[0]}" cy="${punch[1]}" r="9" class="punch"/>`);
 document.getElementById('foldCount').textContent=history.length;document.getElementById('layerCount').textContent=layers.length;document.getElementById('holeCount').textContent=holes.length;document.getElementById('history').textContent=history.length?history.map((x,i)=>(i+1)+'. '+x).join(' → '):'尚未摺紙';
 document.getElementById('quarterButtons').style.display=history.length>=1?'grid':'none';document.getElementById('quarterLocked').style.display=history.length>=1?'none':'block';
 let b=bbox(),ratio=(b.xmax-b.xmin)/(b.ymax-b.ymin);let sq=ratio>.88&&ratio<1.12;document.getElementById('diagButtons').style.display=sq?'grid':'none';document.getElementById('diagLocked').style.display=sq?'none':'block';
 if(!animating)document.getElementById('status').textContent=punch?'已選擇打洞位置':'請選摺法，或直接打洞';
}
document.getElementById('svg').addEventListener('pointerdown',e=>{
 if(animating)return;
 let svg=e.currentTarget,pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;let p0=pt.matrixTransform(svg.getScreenCTM().inverse()),p=[p0.x,p0.y];
 if(!layers.some(L=>pointIn(p,L.poly))){document.getElementById('status').textContent='請點目前有紙的區域';return}
 punch=p;holes=[];document.getElementById('resultMsg').textContent='已打洞，按「展開檢查」查看完整結果。';render();
});
drawGrid();drawTarget();render();
</script>
</body></html>
