(()=>{'use strict';
const $=x=>document.getElementById(x),stage=$('stage'),cv=$('ink'),ctx=cv.getContext('2d'),svg=$('tools'),quick=$('quick');
const palette=['#223b3a','#2455bb','#d55255','#20966d','#a97827'];
const tutorials={
 perpbis:['線段中垂線',['先用直尺畫一條線段 AB。','將圓規針腳放在 A，張開大於 AB 一半的半徑，在線段兩側畫弧。','保持圓規開口不變，改以 B 為圓心畫弧，使兩組弧交於 C、D。','移動直尺通過 C、D，沿尺邊畫線。這條線就是 AB 的中垂線。']],
 perp:['過點作垂線',['先畫一條直線，並在直線上或外選定一點 P。','在畫布上放入三角板，調整其中一邊與已知直線重合。','通過點 P 沿三角板垂直的邊畫線，再移走三角板。']],
 parallel:['過點作平行線',['先用直尺畫出已知直線，標出線外一點 P。','把三角板一邊貼住已知直線，再用直尺作為滑動導軌。','保持三角板方向不變，沿直尺平移到 P，沿對應邊畫出平行線。']],
 median:['三角形中線',['用直尺畫出三角形 ABC。','量出底邊 BC 的中點 M，並標記它。','將直尺對準 A 與 M，畫出線段 AM，即為中線。']],
 altitude:['三角形高線',['用直尺畫出三角形 ABC。','把三角板其中一邊貼齊 BC（必要時延長底邊）。','平移、旋轉三角板，使垂直邊通過 A，畫出垂線 AH。']],
 anglebis:['角平分線',['畫出角 ∠AOB，圓規以 O 為圓心畫弧，交兩邊於 P、Q。','保持相同開口，分別以 P、Q 為圓心畫弧，交於 R。','用直尺連結 O 與 R，射線 OR 即平分 ∠AOB。']]
};
let W=1000,H=600,mode='select',color=palette[0],lineWidth=2.5,grid='none',snap=false,lightGrid=false,guide='perpbis',gstep=0;
let shapes=[],history=[],historyIndex=-1,live=null,gesture=null,compass=null,stowedTools=null,boards=[],activeBoardId=null,focusMode=false,tools={
 ruler:{visible:false,x:100,y:230,a:0,len:370,height:57},
 triangle:{visible:false,x:500,y:135,a:0,kind:45},
 protractor:{visible:false,x:400,y:425,a:0},
 compass:{visible:false,x:520,y:330,a:-.35,r:130}
};
const svgNS='http://www.w3.org/2000/svg';

function eraseAt(p){let i=-1,best=18;shapes.forEach((s,j)=>{let d=9999;if(s.type==='stroke'){for(let k=1;k<s.points.length;k++)d=Math.min(d,near(p,s.points[k-1],s.points[k]).d);if(s.points.length===1)d=dist(p,s.points[0])}else if(s.type==='line')d=near(p,s.a,s.b).d;else if(s.type==='dot')d=dist(p,s);else if(s.type==='arc')d=Math.abs(dist(p,{x:s.cx,y:s.cy})-s.r);if(d<best){i=j;best=d}});if(i>=0){shapes.splice(i,1);draw();snapshot()}}
// Pointer gestures are intentionally separate: moving a physical instrument never creates ink.
svg.addEventListener('pointerdown',e=>{if(mode==='pen'||mode==='eraser')return;const target=e.target.closest('[data-tool]');if(!target)return;const name=target.getAttribute('data-tool'),kind=target.getAttribute('data-action')||'move',t=tools[name];if(!t?.visible)return;e.preventDefault();e.stopPropagation();const p=position(e);gesture={kind,name,start:p,from:{...t},startAngle:Math.atan2(p.y-t.y,p.x-t.x),startRadiusDistance:dist(p,{x:t.x,y:t.y}),arcPrev:t.a,arcStart:t.a,arcDelta:0,arcColor:color};try{svg.setPointerCapture(e.pointerId)}catch{}
 if(kind==='arc'){gesture.arcStart=t.a;gesture.arcPrev=t.a;gesture.arcDelta=0;live={type:'arc',cx:t.x,cy:t.y,r:t.r,a1:t.a,a2:t.a,color,width:lineWidth}}
 gesture.action=kind;
});
svg.addEventListener('pointermove',e=>{if(!gesture)return;const p=position(e),g=gesture,t=tools[g.name];if(g.action==='move'){t.x=g.from.x+p.x-g.start.x;t.y=g.from.y+p.y-g.start.y}else if(g.action==='rotate'){const a=Math.atan2(p.y-t.y,p.x-t.x);t.a=g.from.a+norm(a-g.startAngle);}else if(g.action==='radius'){t.r=Math.max(35,Math.min(390,g.from.r+dist(p,{x:t.x,y:t.y})-g.startRadiusDistance));}else if(g.action==='arc'){const a=Math.atan2(p.y-t.y,p.x-t.x);const delta=norm(a-g.arcPrev);g.arcDelta+=delta;g.arcPrev=a;t.a=a;live={type:'arc',cx:t.x,cy:t.y,r:t.r,a1:g.arcStart,a2:g.arcStart+g.arcDelta,ccw:g.arcDelta<0,color:g.arcColor,width:lineWidth}}
 drawTools();if(g.action==='arc')draw();});
function endGesture(){if(!gesture)return;if(gesture.action==='arc'&&Math.abs(gesture.arcDelta)>.03){shapes.push({...live});snapshot()}if(gesture.name==='compass'&&gesture.action==='move'&&snap){const q=snapPoint({x:tools.compass.x,y:tools.compass.y});tools.compass.x=q.x;tools.compass.y=q.y}gesture=null;live=null;draw();drawTools();persist()}
svg.addEventListener('pointerup',endGesture);svg.addEventListener('pointercancel',endGesture);
let drawing=null;
stage.addEventListener('pointerdown',e=>{if(e.target!==stage&&e.target!==cv&&e.target!==svg)return;if(mode==='pen'){e.preventDefault();const p=position(e),edge=findEdge(p);drawing={edge,pointerId:e.pointerId};if(edge){const start=corrected(p,edge);live={type:'line',a:start,b:start,color,width:lineWidth}}else{live={type:'stroke',points:[snapPoint(p)],color,width:lineWidth}}try{stage.setPointerCapture(e.pointerId)}catch{}draw()}
 else if(mode==='eraser'){e.preventDefault();eraseAt(position(e));drawing={erase:true,pointerId:e.pointerId};try{stage.setPointerCapture(e.pointerId)}catch{}}
});
stage.addEventListener('pointermove',e=>{if(!drawing)return;const p=position(e);if(drawing.erase){eraseAt(p);return}if(live?.type==='line')live.b=corrected(p,drawing.edge);else if(live?.type==='stroke'){const last=live.points.at(-1);const q=snapPoint(p);if(dist(last,q)>1)live.points.push(q)}draw()});
stage.addEventListener('pointerup',()=>{if(!drawing)return;if(!drawing.erase&&live){shapes.push(live);snapshot()}drawing=null;live=null;draw()});stage.addEventListener('pointercancel',()=>{drawing=null;live=null;draw()});

function openSettings(view='home'){setSettingsView(view);$('settingsPanel').hidden=false;$('settingsScrim').hidden=false;$('settingsToggle').setAttribute('aria-expanded','true');if(view==='boards')renderBoards()}
function infoPage(title,body){$('infoTitle').textContent=title;$('infoBody').textContent=body;openSettings('info')}
function goFocus(on){focusMode=on;document.body.classList.toggle('focusMode',on);$('focusModeBtn').textContent=on?'返回一般模式':'進入專注模式';closeSettings();requestAnimationFrame(fit)}
function newBoardId(){return 'board-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)}
function selectBoard(id){if(activeBoardId===id){closeSettings();return}
 persist();const b=boards.find(x=>x.id===id);if(!b)return;activeBoardId=id;applyBoardData(b.data);
 history=[];historyIndex=-1;snapshot();useMode('select');closeSettings();fit()}
function createBoard(duplicate=false){
 persist();const old=boards.find(b=>b.id===activeBoardId);
 const data=duplicate?JSON.parse(JSON.stringify(currentBoardData())):currentBoardData();
 if(!duplicate){data.shapes=[];data.stowedTools=null;for(const key of Object.keys(data.tools))data.tools[key].visible=false}
 const id=newBoardId(),name=duplicate?(old?.name||'教學畫布')+'（副本）':'教學畫布 '+(boards.length+1);
 boards.push({id,name,data});selectBoard(id);openSettings('boards')
}
function renameBoard(id){const b=boards.find(x=>x.id===id);if(!b)return;const name=prompt('請輸入畫布名稱',b.name);if(name===null)return;const clean=name.trim().slice(0,35);if(!clean)return;b.name=clean;persist();renderBoards()}
function deleteBoard(id){if(boards.length<2){showToast('至少需要保留一張教學畫布。');return}const b=boards.find(x=>x.id===id);if(!b||!confirm('確定刪除「'+b.name+'」嗎？這張畫布的筆跡將無法還原。'))return;
 persist();boards=boards.filter(x=>x.id!==id);if(activeBoardId===id){const next=boards[0];activeBoardId=next.id;applyBoardData(next.data);history=[];historyIndex=-1;snapshot();useMode('select');fit()}else persist();renderBoards()}
function renderBoards(){
 const root=$('boardsList');root.replaceChildren();
 for(const b of boards){
  const row=document.createElement('div');row.className='boardRow'+(b.id===activeBoardId?' active':'');
  const top=document.createElement('div');top.className='boardRowTop';
  const title=document.createElement('strong');title.textContent=b.name;
  const sub=document.createElement('small');sub.textContent=b.id===activeBoardId?'目前畫布':'已儲存';
  top.append(title,sub);row.appendChild(top);
  const actions=document.createElement('div');actions.className='boardActions';
  for(const [label,fn] of [['開啟',()=>selectBoard(b.id)],['重新命名',()=>renameBoard(b.id)],['刪除',()=>deleteBoard(b.id)]]){
   const button=document.createElement('button');button.textContent=label;button.type='button';button.disabled=label==='刪除'&&boards.length<=1;
   button.addEventListener('click',fn);actions.appendChild(button)}
  row.appendChild(actions);root.appendChild(row)
 }
}
