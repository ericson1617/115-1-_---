  const d=currentBoardData();localStorage.setItem('geometry-physical-v1',JSON.stringify(d));

  img.onload=()=>{URL.revokeObjectURL(url);if(recordSession===r&&!r.ending)r.instrumentImage=img;if(r.instrumentDirty)scheduleRecordingSvg()};
  img.onerror=()=>{URL.revokeObjectURL(url);if(r.instrumentDirty)scheduleRecordingSvg()};
  img.src=url;
 },65);
}
function startRecording(){
 if(recordSession)return;
 if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){
  alert('此瀏覽器不支援畫布錄影，請使用最新版 Chrome 或 Edge。');return;
 }
 const type=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'].find(t=>MediaRecorder.isTypeSupported(t));
 if(!type){alert('目前瀏覽器不支援下載錄影格式。');return}
 try{
  const canvas=document.createElement('canvas'),scale=Math.min(2,window.devicePixelRatio||1.5);
  canvas.width=Math.max(640,Math.round(W*scale));canvas.height=Math.max(360,Math.round(H*scale));
  const stream=canvas.captureStream(24),recorder=new MediaRecorder(stream,{mimeType:type,videoBitsPerSecond:4000000});
  const state={canvas,context:canvas.getContext('2d'),stream,recorder,chunks:[],started:Date.now(),frame:0,
     instrumentImage:null,instrumentTimer:null,instrumentDirty:false,ending:false,mime:type};
  recordSession=state;
  recorder.addEventListener('dataavailable',e=>{if(e.data&&e.data.size)state.chunks.push(e.data)});
  recorder.addEventListener('error',e=>{console.error('錄影錯誤',e);showToast('錄影失敗，請重新開始。');stopRecording()});
  recorder.addEventListener('stop',()=>{
   cancelAnimationFrame(state.frame);clearTimeout(state.instrumentTimer);
   state.stream.getTracks().forEach(t=>t.stop());
   if(state.chunks.length){const ext=type.startsWith('video/mp4')?'mp4':'webm';
    const board=boards.find(b=>b.id===activeBoardId);
    const name=(board?.name||'尺規做圖工作坊').replace(/[\\/:*?"<>|]/g,'_').slice(0,45);
    downloadBlob(new Blob(state.chunks,{type}),name+'-作畫錄影.'+ext);
    showToast('已下載錄影影片（含畫布筆跡與尺規操作；不含麥克風聲音）。')}
   else showToast('沒有取得錄影片段。');
  });
  recorder.start(400);
  setRecordingUi(true);scheduleRecordingSvg();renderRecordingFrame();
 }catch(err){if(recordSession){recordSession.stream?.getTracks().forEach(t=>t.stop());recordSession=null}
  alert('無法啟動錄影：'+(err?.message||'瀏覽器不支援'))}
}
function stopRecording(){
 const state=recordSession;if(!state||state.ending)return;
 state.ending=true;recordSession=null;
 clearTimeout(state.instrumentTimer);cancelAnimationFrame(state.frame);setRecordingUi(false);
 try{if(state.recorder.state!=='inactive')state.recorder.stop();else state.stream.getTracks().forEach(t=>t.stop())}
 catch(err){console.error('停止錄影失敗',err);state.stream.getTracks().forEach(t=>t.stop())}
}
function toggleRecording(){recordSession?stopRecording():startRecording()}

function isHexColor(s){return typeof s==='string'&&/^#[0-9a-f]{6}$/i.test(s)}
function normalizeAppearance(src){
 const a={...appearanceDefaults};if(src&&typeof src==='object'){
  for(const key of ['paper','grid','tool'])if(isHexColor(src[key]))a[key]=src[key].toLowerCase();
  if(Number.isFinite(src.opacity))a.opacity=Math.max(.1,Math.min(1,src.opacity));
 }return a;
}
function loadAppearance(){try{appearance=normalizeAppearance(JSON.parse(localStorage.getItem(appearanceKey)||'null'))}catch{appearance={...appearanceDefaults}}applyAppearance()}
function applyAppearance(){
 document.documentElement.style.setProperty('--paper',appearance.paper);
 document.documentElement.style.setProperty('--tool-color',appearance.tool);
 stage.style.backgroundColor=appearance.paper;
 syncAppearanceControls();
 if(W&&H){draw();drawTools()}
}
function syncAppearanceControls(){
 const values={customPenColor:color,customPaperColor:appearance.paper,customGridColor:appearance.grid,customToolColor:appearance.tool};
 const outputs={customPenColor:'penColorValue',customPaperColor:'paperColorValue',customGridColor:'gridColorValue',customToolColor:'toolColorValue'};
 for(const [key,val] of Object.entries(values)){const el=$(key);if(!el)return;el.value=val;$(outputs[key]).textContent=val}
 $('customGridOpacity').value=Math.round(appearance.opacity*100);
 $('gridOpacityValue').textContent=Math.round(appearance.opacity*100)+'%';
 const r=parseInt(appearance.grid.slice(1,3),16),g=parseInt(appearance.grid.slice(3,5),16),b=parseInt(appearance.grid.slice(5,7),16);
 const alpha=lightGrid?Math.min(appearance.opacity,.23):appearance.opacity;
 const c='rgba('+r+','+g+','+b+','+alpha+')';
 $('gridPreview').style.backgroundColor=appearance.paper;
 $('gridPreview').style.backgroundImage='linear-gradient(to right,'+c+' 1px,transparent 1px),linear-gradient(to bottom,'+c+' 1px,transparent 1px)';
}
function saveAppearance(){
 try{localStorage.setItem(appearanceKey,JSON.stringify(appearance))}catch{}
 applyAppearance();persist();
}
for(const [id,key] of [['customPaperColor','paper'],['customGridColor','grid'],['customToolColor','tool']]){
 $(id).addEventListener('input',e=>{if(!isHexColor(e.target.value))return;appearance[key]=e.target.value;saveAppearance()});
}

const projectTag='ruler-compass-workshop';
function downloadBlob(blob,name){
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),60000);
}
function exportProjectObject(all=true){
 persist();const active=boards.find(b=>b.id===activeBoardId);
 const chosen=all?boards:active?[active]:[];
 return {app:projectTag,version:1,exportedAt:new Date().toISOString(),activeBoardId:activeBoardId,appearance:{...appearance},
  boards:chosen.map(b=>({id:b.id,name:b.name,data:b.id===activeBoardId?currentBoardData():b.data}))};
}
function exportProject(){
 const payload=JSON.stringify(exportProjectObject(true),null,2);
 downloadBlob(new Blob([payload],{type:'application/json;charset=utf-8'}),'尺規做圖工作坊-可編輯檔.json');
 showToast('已匯出可編輯檔，包含全部畫布、筆跡、尺規位置和個人化設定。');
}
function validateProject(p){
 if(!p||p.app!==projectTag||p.version!==1||!Array.isArray(p.boards)||!p.boards.length||p.boards.length>60)throw Error('檔案不是支援的尺規做圖工作坊專案。');
 let points=0;
 for(const b of p.boards){
  if(!b||typeof b.name!=='string'||!b.data||!Array.isArray(b.data.shapes)||b.data.shapes.length>4500)throw Error('專案畫布資料不完整或超出容量。');
  for(const item of b.data.shapes){
   if(!item||!['stroke','line','arc','dot'].includes(item.type))throw Error('專案包含不支援的筆跡資料。');
   if(item.type==='stroke'&&!Array.isArray(item.points))throw Error('自由筆跡資料不完整。');
   points+=item.type==='stroke'?item.points.length:1;
   if(points>140000)throw Error('專案包含過多筆跡點，請分批匯入。');
  }
 }
 return p;
}
function importProjectObject(p){
 validateProject(p);
 // Import as new boards instead of destroying existing classroom work.
 if(boards.length+p.boards.length>100)throw Error('畫布數量過多，請先刪除不需要的畫布。');
 persist();
 let selectedId=null;
 for(const b of p.boards){
  const id=newBoardId();
  boards.push({id,name:b.name.slice(0,40)||'匯入畫布',data:JSON.parse(JSON.stringify(b.data))});
  if(b.id===p.activeBoardId||selectedId===null)selectedId=id;
 }
 
 activeBoardId=selectedId;
 applyBoardData(boards.find(b=>b.id===selectedId).data);
 if(p.appearance&&typeof p.appearance==='object'){appearance=normalizeAppearance(p.appearance);
   try{localStorage.setItem(appearanceKey,JSON.stringify(appearance))}catch{}applyAppearance()}
 history=[];historyIndex=-1;snapshot();useMode('select');fit();closeSettings();
 showToast('已匯入 '+p.boards.length+' 張畫布，可接續移動尺規、編輯和做圖。');
}
async function readProjectFile(file){
 if(!file)return;
 if(file.size>8*1024*1024){alert('專案檔不可超過 8 MB。');return}
 try{const obj=JSON.parse(await file.text());importProjectObject(obj)}
 catch(e){alert('無法匯入專案：'+(e?.message||'檔案格式不正確'))}
}
function bytesToBase64Url(bytes){
 let binary='';for(let i=0;i<bytes.length;i+=16384)binary+=String.fromCharCode(...bytes.subarray(i,i+16384));
 return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function base64UrlToBytes(text){
 let str=text.replace(/-/g,'+').replace(/_/g,'/');str+='='.repeat((4-str.length%4)%4);
 const binary=atob(str);return Uint8Array.from(binary,c=>c.charCodeAt(0));
}
async function encodeProjectLink(obj){
 const bytes=new TextEncoder().encode(JSON.stringify(obj));
 if(!('CompressionStream' in window))throw Error('此瀏覽器不支援分享連結壓縮，請改用下載專案檔。');
 const stream=new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'));
 const result=new Uint8Array(await new Response(stream).arrayBuffer());
 const fragment=bytesToBase64Url(result);
 if(fragment.length>24000)throw Error('這張畫布內容較多，請改用專案檔分享，以免網址過長。');
 return location.origin+location.pathname+'#project='+fragment;
}
async function decodeProjectLink(value){
 if(value.length>24000)throw Error('分享連結超過支援長度。');
 if(!('DecompressionStream' in window))throw Error('此瀏覽器不支援載入壓縮專案連結。');
 const stream=new Blob([base64UrlToBytes(value)]).stream().pipeThrough(new DecompressionStream('gzip'));
 const blob=new Blob([await new Response(stream).arrayBuffer()]);
 if(blob.size>8*1024*1024)throw Error('分享內容超出支援容量。');
 return JSON.parse(await blob.text());
}
async function shareCurrentBoard(){
 try{const url=await encodeProjectLink(exportProjectObject(false));
  try{await navigator.clipboard.writeText(url);showToast('已複製課堂分享連結，學生開啟即可載入畫布。')}
  catch{prompt('請複製此課堂分享連結',url)}
 }catch(e){alert(e.message)}
}
async function loadSharedProject(){
 const fragment=location.hash;
 if(!fragment.startsWith('#project='))return;
 const value=fragment.slice(9);
 try{
  const p=validateProject(await decodeProjectLink(value));
  if(confirm('偵測到課堂分享畫布。要匯入並開啟嗎？\n現有畫布不會被刪除。'))importProjectObject(p);
 }catch(e){alert('載入課堂分享連結失敗：'+e.message)}
 finally{window.history.replaceState(window.history.state,'',location.pathname+location.search)}
}
